function bookCode(name){ return name.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,12); }
function slug(s){ return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40) || 'p'+Math.random().toString(36).slice(2,7); }
function rid(n){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1;
    window.speechSynthesis.speak(u);
  }catch(e){ console.error('speech failed', e); }
}

function fsDocId(key){ return key.replace(/[\/]/g,'_'); }
async function sGet(key){
  try{
    if(db){
      const doc = await db.collection('quizbee_kv').doc(fsDocId(key)).get();
      return doc.exists ? JSON.parse(doc.data().value) : null;
    }
    if(hasClaudeStorage){ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
    return null;
  }catch(e){ return null; }
}
async function sSet(key, val){
  try{
    if(db){ await db.collection('quizbee_kv').doc(fsDocId(key)).set({ value: JSON.stringify(val), updatedAt: Date.now() }); return true; }
    if(hasClaudeStorage){ await window.storage.set(key, JSON.stringify(val), true); return true; }
    return false;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

function poolIdFor(passages){
  return 'pool_' + passages.map(p=>`${bookCode(p.book)}${p.start}-${p.end}`).sort().join('_').slice(0,140);
}
function chapterBankKey(book, chapter){
  return `qb:${bookCode(book)}:${parseInt(chapter)}`;
}
async function getChapterBank(book, chapter){
  const key = chapterBankKey(book, chapter);
  const bank = await sGet(key);

  if(!bank){
    return {
      book,
      chapter: parseInt(chapter),
      questions: []
    };
  }

  return {
    book,
    chapter: parseInt(chapter),
    questions: Array.isArray(bank.questions) ? bank.questions : []
  };
}

async function saveChapterBank(book, chapter, questions){
  const key = chapterBankKey(book, chapter);

  const bank = {
    book,
    chapter: parseInt(chapter),
    questions: Array.isArray(questions) ? questions : [],
    updatedAt: Date.now()
  };

  await sSet(key, bank);

  return bank;
}
async function importChapterQuestions(book, chapter, questions){
  if(!book || !chapter){
    throw new Error('Book and chapter are required');
  }

  if(!Array.isArray(questions)){
    throw new Error('Questions must be an array');
  }

  const valid = questions
    .filter(q => q && q.q && q.a)
    .map(q => ({
      id: q.id || ('q' + Math.random().toString(36).slice(2,9)),
      q: String(q.q).trim().slice(0,300),
      a: String(q.a).trim().slice(0,200),
      ref: String(q.ref || '').trim().slice(0,60),
      src: String(q.src || book).trim().slice(0,40),
      book: book,
      chapter: parseInt(chapter)
    }))
    .filter(q => q.q && q.a);

  if(!valid.length){
    throw new Error('No valid questions found');
  }

  const existingBank = await getChapterBank(book, chapter);

  const seen = new Set(
    existingBank.questions.map(q =>
      String(q.q).trim().toLowerCase()
    )
  );

  let added = 0;

  for(const item of valid){
    const key = item.q.toLowerCase();

    if(seen.has(key)) continue;

    existingBank.questions.push(item);
    seen.add(key);
    added++;
  }

  await saveChapterBank(
    book,
    chapter,
    existingBank.questions
  );

  const result = await getChapterBank(book, chapter);

  console.log(
    `[Chapter Import] ${book} ${chapter}: ` +
    `added ${added}, total ${result.questions.length}`
  );

  return result;
}

window.importChapterQuestions = importChapterQuestions;

window.saveChapterBank = saveChapterBank;
function passageStr(p){ return p.start===p.end ? `${p.book} ${p.start}` : `${p.book} ${p.start}-${p.end}`; }
function passagesStr(list){ return list.map(passageStr).join('; '); }

// Questions are generated through a small serverless proxy you deploy once
// (Cloudflare Worker, free). It holds your Gemini key server-side so it
// never appears in this file or your GitHub repo. See README.md.
const WORKER_URL = "https://stellar-sunshine-398f8f.netlify.app/.netlify/functions/gemini-proxy";
function hasWorkerConfigured(){ return !!WORKER_URL && !WORKER_URL.includes('your-worker'); }

async function callGemini(prompt){
  if(!hasWorkerConfigured()) throw new Error('missing_worker_url');

  const res = await fetch(WORKER_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      contents:[{ parts:[{ text: prompt }] }],
      generationConfig:{
        maxOutputTokens: 6000,
        temperature: 0.9
      }
    })
  });

  const data = await res.json();

  if(data.error){
    throw new Error(data.error.message || 'Generation error');
  }

  const parts =
    data.candidates &&
    data.candidates[0] &&
    data.candidates[0].content &&
    data.candidates[0].content.parts;

  const text = parts
    ? parts.map(p => p.text || '').join('')
    : '';

  if(!text){
    throw new Error('No text in response');
  }

  let raw = text.trim();

  // Remove Markdown code fences if Gemini adds them
  raw = raw
    .replace(/^```json\s*/i, '')
    .replace(/^```\s*/i, '')
    .replace(/\s*```$/i, '')
    .trim();

  // Find the JSON array
  const start = raw.indexOf('[');

  if(start === -1){
    console.error('[Gemini] No JSON array found. Raw response:', raw);
    throw new Error('No JSON array found');
  }

  // Find the matching closing bracket instead of
  // blindly using the last character.
  let depth = 0;
  let end = -1;
  let inString = false;
  let escaped = false;

  for(let i = start; i < raw.length; i++){
    const char = raw[i];

    if(inString){
      if(escaped){
        escaped = false;
      } else if(char === '\\'){
        escaped = true;
      } else if(char === '"'){
        inString = false;
      }
      continue;
    }

    if(char === '"'){
      inString = true;
      continue;
    }

    if(char === '['){
      depth++;
    } else if(char === ']'){
      depth--;

      if(depth === 0){
        end = i;
        break;
      }
    }
  }

  if(end === -1){
    console.error('[Gemini] Incomplete JSON array. Raw response:', raw);
    throw new Error('Incomplete JSON array');
  }

  const jsonText = raw.slice(start, end + 1);

  try{
    const parsed = JSON.parse(jsonText);

    if(!Array.isArray(parsed)){
      throw new Error('Gemini response was not an array');
    }

    return parsed;

  } catch(parseError){
    console.error('[Gemini] JSON parse failed:', parseError);
    console.error('[Gemini] JSON text:', jsonText);

    throw new Error('Invalid JSON returned by Gemini');
  }
}

const MIN_CHAPTER_QUESTIONS = 50;
const BATCH_SIZE = 10;
async function generateBatch(passages, recentQs){
  const prompt = `You are writing trivia questions for a children's Bible quiz bee (ages 8-14), Protestant canon.
Passage scope (draw questions from across ALL of this range, not just the beginning): ${passagesStr(passages)}
Write exactly ${BATCH_SIZE} NEW short factual questions. Good topics: names, numbers, places, who-said-it, what-happened-next, order of events. Each answer should be short (a few words).
Do not repeat or closely resemble any of these already-used questions: ${recentQs.slice(-20).join(' || ') || '(none yet)'}
Return ONLY a raw JSON array, nothing else, in exactly this shape:
[{"q":"question text","a":"expected short answer","ref":"Book Chapter:Verse","src":"Book name"}]`;
  const items = await callGemini(prompt);
  return items.filter(it=>it && it.q && it.a).map(it=>({
    id: 'q'+Math.random().toString(36).slice(2,9),
    q: String(it.q).slice(0,300),
    a: String(it.a).slice(0,200),
    ref: String(it.ref||'').slice(0,60),
    src: String(it.src||'').slice(0,40)
  }));
}
async function generateChapterBatch(book, chapter, recentQs){
  const prompt = `You are writing trivia questions for a children's Bible quiz bee (ages 8-14), Protestant canon.

Bible scope: ${book} chapter ${chapter} ONLY.

Write exactly ${BATCH_SIZE} NEW short factual questions based ONLY on ${book} chapter ${chapter}.

Questions should cover different details from the chapter, including:
- names
- numbers
- places
- events
- commands
- relationships
- who said what
- sequence/order of events
- important facts

Do not repeat or closely resemble any of these existing questions:
${recentQs.slice(-30).join(' || ') || '(none yet)'}

Every question MUST be answerable directly from ${book} chapter ${chapter}.

Return ONLY a raw JSON array, nothing else, in exactly this shape:

async function ensureChapterBank(book, chapter, onProgress){
  let bank = await getChapterBank(book, chapter);

  if(chapterBankReady(bank)){
    if(onProgress) onProgress({...bank});
    return bank;
  }

  let attempts = 0;
  const MAX_ATTEMPTS = 10;

  while(
    bank.questions.length < MIN_CHAPTER_QUESTIONS &&
    attempts < MAX_ATTEMPTS
  ){
    attempts++;

    const recentQs = bank.questions.map(q => q.q);

    try {
      const batch = await generateChapterBatch(
        book,
        chapter,
        recentQs
      );

      if(!Array.isArray(batch) || batch.length === 0){
        console.warn(
          `[Chapter Bank] Empty batch for ${book} ${chapter}`
        );
        continue;
      }

      const seen = new Set(
        bank.questions.map(q =>
          String(q.q).trim().toLowerCase()
        )
      );

      let added = 0;

      for(const item of batch){

        if(!item || !item.q || !item.a) continue;

        const key = String(item.q)
          .trim()
          .toLowerCase();

        if(seen.has(key)) continue;

        seen.add(key);
        bank.questions.push(item);
        added++;

        if(
          bank.questions.length >=
          MIN_CHAPTER_QUESTIONS
        ){
          break;
        }
      }

      console.log(
        `[Chapter Bank] ${book} ${chapter}: ` +
        `added ${added}, total ${bank.questions.length}`
      );

      // IMPORTANT: save after every successful batch
      await saveChapterBank(
        book,
        chapter,
        bank.questions
      );

      if(onProgress){
        onProgress({...bank});
      }

    } catch(error){

      console.error(
        `[Chapter Bank] Batch ${attempts} failed:`,
        error
      );

      // Wait briefly before trying again.
      await new Promise(resolve =>
        setTimeout(resolve, 1500)
      );
    }
  }

  if(bank.questions.length >= MIN_CHAPTER_QUESTIONS){
    console.log(
      `[Chapter Bank] READY: ${book} ${chapter} ` +
      `with ${bank.questions.length} questions`
    );
  } else {
    console.warn(
      `[Chapter Bank] STOPPED: ${book} ${chapter} ` +
      `has only ${bank.questions.length} questions ` +
      `after ${attempts} attempts`
    );
  }

  return bank;
}

const CONCURRENCY = 1
async function ensurePool(passages, target, onProgress){
  const poolId = poolIdFor(passages);
  const key = 'sq:pool:'+poolId;
  let pool = await sGet(key);
  if(!pool) pool = {poolId, passages, target, status:'idle', questions:[]};
  if(pool.questions.length >= target && pool.status==='ready') return pool;
  pool.status='generating'; pool.target = target;
  await sSet(key, pool);
  let rounds = 0;
  while(pool.questions.length < target && rounds < 10){
    rounds++;
    const seen = new Set(pool.questions.map(q=>q.q));
    const need = target - pool.questions.length;
    const batchesThisRound = Math.max(1, Math.min(CONCURRENCY, Math.ceil(need/BATCH_SIZE)));
    const promises = [];
    for(let i=0;i<batchesThisRound;i++){
      promises.push(generateBatch(passages, pool.questions.map(q=>q.q)).catch(e=>{ console.error('batch failed', e); return []; }));
    }
    const results = await Promise.all(promises);
    for(const batch of results){
      for(const item of batch){
        if(!seen.has(item.q) && pool.questions.length < target*1.4){
          pool.questions.push(item); seen.add(item.q);
        }
      }
    }
    await sSet(key, pool);
    if(onProgress) onProgress({...pool});
  }
  pool.status='ready';
  await sSet(key, pool);
  if(onProgress) onProgress({...pool});
  return pool;
}

function addPassageToGroup(gid, book, start, end){
  const g = S.meta.groups.find(g=>g.id===gid); if(!g) return;
  start=parseInt(start); end=parseInt(end);
  if(!book || isNaN(start) || isNaN(end) || start<1 || end<start) { setToast('Enter a valid chapter range'); return; }
  g.passages.push({book, start, end});
  saveMeta(); render();
}
function removePassage(gid, idx){

}
function setGroupName(gid, name){
  const g = S.meta.groups.find(g=>g.id===gid); if(!g) return;
  g.name = name || g.name; saveMeta();
}
async function generateAllPools(){
  if(!hasWorkerConfigured()){ setToast('The question-generation proxy is not set up yet — see README'); return; }
  S.busy=true; render();
  const uniquePools = {};
  for(const g of S.meta.groups){
    if(!g.passages.length) continue;
    const pid = poolIdFor(g.passages);
    g.poolId = pid;
    uniquePools[pid] = g.passages;
  }
  await saveMeta();
  await Promise.all(Object.keys(uniquePools).map(pid =>
    ensurePool(uniquePools[pid], S.meta.questionsPerPool, (snap)=>{ S.poolCache[pid]=snap; render(); })
  ));
  S.busy=false;
  const anyEmpty = Object.values(S.poolCache).some(p=>p.questions.length===0);
  if(anyEmpty) setToast('No questions came back — check the proxy Worker is deployed correctly');
  render();
}
async function openSession(){
  if(!S.meta.groups.length || S.meta.groups.every(g=>!g.names.length)){
    setToast('Add at least one group with names first'); return;
  }
  S.meta.status='active'; await saveMeta();
  S.view='m-live';
  startPoll(refreshMonitor, 3500);
  await refreshMonitor();
}
async function refreshMonitor(){
  const fresh = await loadMeta(S.code);
  if(fresh) S.meta = fresh;
  const data = {};
  for(const g of S.meta.groups){
    for(const name of g.names){
      const uid = g.id+'_'+slug(name);
      const u = await sGet('sq:user:'+S.code+':'+uid);
      if(u){
        const vals = Object.values(u.results||{});
        data[uid] = { answered: vals.length, correct: vals.filter(v=>v.verdict==='correct').length };
      }
    }
  }
  S.monitorData = data;
  render();
}
async function endSession(){
  S.meta.status='ended'; await saveMeta();
  stopPoll();
  S.view='m-results';
  await loadAllUsersForResults();
}
async function loadAllUsersForResults(){
  S.resultsUsers = [];
  for(const g of S.meta.groups){
    for(const name of g.names){
      const uid = g.id+'_'+slug(name);
      const u = await sGet('sq:user:'+S.code+':'+uid);
      const pool = g.poolId ? await sGet('sq:pool:'+g.poolId) : null;
      S.resultsUsers.push({ group:g, name, user:u, pool });
    }
  }
  render();
}

async function loadPlaySession(gid, name){
  const g = S.meta.groups.find(g=>g.id===gid); if(!g) return null;
  const uid = gid+'_'+slug(name);
  let user = await sGet('sq:user:'+S.code+':'+uid);
  if(!user){
    user = { id:uid, name, groupId:gid, poolId:g.poolId||null, board:[], results:{} };
    await sSet('sq:user:'+S.code+':'+uid, user);
  }
  let pool = null;
  if(g.poolId){
    pool = await sGet('sq:pool:'+g.poolId);
    if(pool && !user.board.length && pool.status==='ready' && pool.questions.length){
      const order = shuffle(pool.questions.map((q,i)=>i));
      user.board = order.map((qi,idx)=>({number: idx+1, qId: pool.questions[qi].id}));
      user.poolId = g.poolId;
      await sSet('sq:user:'+S.code+':'+uid, user);
    }
  }
  return { code:S.code, groupId:gid, groupName:g.name, passages:g.passages, userId:uid, user, pool, selNum:null, revealed:false };
}

  document.getElementById('topbar-code-slot').innerHTML = S.code ? `<div class="code-chip" style="font-size:13px;padding:6px 12px;">${esc(S.code)}</div>` : '';
  let html = S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '';

  </div>
  ${(S.resultsUsers||[]).map(r=>renderUserDetail(r)).join('')}
  <button class="linkbtn" data-act="go-home" style="margin-top:6px;">&larr; back to home</button>
  `;
}
function renderUserDetail(r){
  if(!r.user || !r.pool) return '';
  const results = r.user.results||{};
  const answeredIds = Object.keys(results);
  if(!answeredIds.length) return '';
  const byPassage = {};
  answeredIds.forEach(qId=>{
    const q = r.pool.questions.find(x=>x.id===qId); if(!q) return;
    const key = q.src || 'General';
    byPassage[key] = byPassage[key] || {correct:0,total:0};
    byPassage[key].total++;
    if(results[qId].verdict==='correct') byPassage[key].correct++;
  });
  const missed = answeredIds.filter(id=>results[id].verdict==='incorrect').map(id=>r.pool.questions.find(q=>q.id===id)).filter(Boolean);
  const correct = answeredIds.filter(id=>results[id].verdict==='correct').length;
  const skip = answeredIds.filter(id=>results[id].verdict==='skip').length;
  return `
  <div class="card">
    <div class="group-title" style="margin-bottom:10px;">${esc(r.name)} <span style="font-size:12px;color:#888;font-weight:400;">${esc(r.group.name)}</span></div>
    <div class="row" style="margin-bottom:14px;">
      <div class="stat"><div class="stat-num">${correct}</div><div class="stat-label">Correct</div></div>
      <div class="stat"><div class="stat-num">${answeredIds.length-correct-skip}</div><div class="stat-label">Incorrect</div></div>
      <div class="stat"><div class="stat-num">${answeredIds.length}</div><div class="stat-label">Attempted</div></div>
    </div>
    ${Object.keys(byPassage).length>1 ? `<div style="margin-bottom:12px;">
      <div class="label" style="color:#8a8a8a;">By passage</div>
      ${Object.entries(byPassage).map(([k,v])=>`<div style="font-size:13px;color:#333;margin:3px 0;">${esc(k)}: ${v.correct}/${v.total} correct</div>`).join('')}
    </div>`:''}
    ${missed.length ? `<div>
      <div class="label" style="color:#8a8a8a;">Missed questions — worth reviewing</div>
      <ul style="margin:8px 0 0; padding-left:18px; font-size:13px; color:#333;">
        ${missed.map(q=>`<li style="margin-bottom:6px;"><b>${esc(q.q)}</b><br><span style="color:#2F8F5B;">Answer: ${esc(q.a)}</span> <span style="color:#999;">(${esc(q.ref)})</span></li>`).join('')}
      </ul>
    </div>` : '<div style="font-size:13px;color:#2F8F5B;">No missed questions — strong round!</div>'}
  </div>`;
}

function renderPlayScreen(){
  const play = S.activePlay;
  if(!play) return '<div class="empty">No active contestant.</div>';
  return `
  <div class="eyebrow">${esc(play.groupName)} &middot; ${esc(passagesStr(play.passages))}</div>
  <div class="h1">Hi ${esc(play.user.name)}</div>
  ${renderBoardUI(play, false)}`;
}

function renderBoardUI(play, isConsole){
  if(!play.pool || play.pool.status!=='ready' || !play.pool.questions.length){
    const count = play.pool ? play.pool.questions.length : 0;
    const target = play.pool ? play.pool.target : null;
    return `
    <p class="sub" style="margin-top:10px;">Getting ${esc(play.user.name)}'s questions ready… ${count}${target?'/'+target:''} prepared.</p>
    <div class="progressbar"><div class="progressfill" style="width:${target?Math.min(100,Math.round(count/target*100)):8}%;"></div></div>`;
  }
  const total = play.user.board.length;
  const done = Object.keys(play.user.results).length;
  let questionHtml = '';
  if(play.selNum!=null){
    const b = play.user.board.find(x=>x.number===play.selNum);
    const q = b ? findQuestion(play.pool, b.qId) : null;
    if(q){
      const already = play.user.results[q.id];
      questionHtml = `
      <div class="qcard">
        <div class="qref">Number ${play.selNum} &middot; ${esc(q.ref||q.src||'')}</div>
        <div class="qtext">${esc(q.q)}</div>
        <div class="row">
          <button class="btn btn-sm speakbtn" data-act="speak-q" data-text="${esc(q.q)}">🔊 Read question aloud</button>
          <button class="btn btn-sm btn-dark" data-act="toggle-reveal">${play.revealed?'Hide answer':'Show answer'}</button>
        </div>
        <div class="answerbox ${play.revealed?'shown':''}">
          <b>Answer:</b> ${esc(q.a)}
          <div style="margin-top:8px;"><button class="btn btn-sm speakbtn" data-act="speak-a" data-text="${esc(q.a)}">🔊 Read answer aloud</button></div>
        </div>
        <div class="row" style="margin-top:16px;">
          <button class="btn btn-sm" style="background:var(--moss);color:#fff;" data-act="mark" data-verdict="correct" data-qid="${q.id}" data-num="${play.selNum}">Correct</button>
          <button class="btn btn-sm" style="background:var(--red);color:#fff;" data-act="mark" data-verdict="incorrect" data-qid="${q.id}" data-num="${play.selNum}">Incorrect</button>
          <button class="btn btn-sm btn-dark" data-act="mark" data-verdict="skip" data-qid="${q.id}" data-num="${play.selNum}">Skip</button>
        </div>
        ${already? `<div style="margin-top:10px;font-size:12px;color:#999;">Previously marked: ${already.verdict}</div>`:''}
      </div>`;
    }
  }
  return `
  <p class="sub" style="margin-top:${isConsole?'12':'0'}px;">${done} of ${total} answered${isConsole?'':''}. Pick a number to get the next question.</p>
  ${questionHtml}
  <div class="numgrid">
    ${play.user.board.map(b=>{
      const r = play.user.results[b.qId];
      return `<div class="num" ${r?`data-done="${r.verdict}"`:''} data-act="pick-num" data-num="${b.number}">${b.number}</div>`;
    }).join('')}
  </div>`;
}

// ---------- Events ----------
function wireEvents(root){
  root.querySelectorAll('[data-act]').forEach(node=>{
    const act = node.getAttribute('data-act');
    const evt = (node.tagName==='TEXTAREA' || (node.tagName==='INPUT' && act==='rename-group')) ? 'change' : 'click';
    node.addEventListener(evt, async (e)=>{
      if(act==='go-master'){ await createSession(); }
      else if(act==='go-join'){ stopPoll(); S.view='p-join'; render(); }
      else if(act==='go-home'){ stopPoll(); S.view='home'; S.meta=null; S.code=null; S.activePlay=null; render(); }
      else if(act==='do-join'){ const v = document.getElementById('joincode').value; await joinWithCode(v); }
      else if(act==='pick-name'){ await pickParticipant(node.dataset.gid, node.dataset.name); }
      else if(act==='add-group'){ addGroup(); }
      else if(act==='remove-group'){ removeGroup(node.dataset.gid); }
      else if(act==='rename-group'){ setGroupName(node.dataset.gid, node.value); }
      else if(act==='add-passage'){
        const card = node.closest('.group-card');
        const book = card.querySelector('[data-role="book"]').value;
        const start = card.querySelector('[data-role="start"]').value;
        const end = card.querySelector('[data-role="end"]').value;
        addPassageToGroup(node.dataset.gid, book, start, end);
      }
      else if(act==='rm-passage'){ removePassage(node.dataset.gid, parseInt(node.dataset.idx)); }
      else if(act==='set-names'){ setGroupNames(node.dataset.gid, node.value); }
      else if(act==='gen-pools'){ await generateAllPools(); }
      else if(act==='open-session'){ await openSession(); }
      else if(act==='end-session'){ await endSession(); }
      else if(act==='pick-num'){ pickNumber(parseInt(node.dataset.num)); }
      else if(act==='toggle-reveal'){ toggleReveal(); }
      else if(act==='mark'){ await markResult(node.dataset.qid, parseInt(node.dataset.num), node.dataset.verdict); }
      else if(act==='speak-q' || act==='speak-a'){ speak(node.dataset.text); }
    });
  });
  const qpp = root.querySelector('#qpp');
  if(qpp) qpp.addEventListener('change', ()=>{ S.meta.questionsPerPool = parseInt(qpp.value); saveMeta(); });
  const ar = root.querySelector('#autoreveal');
  if(ar) ar.addEventListener('change', ()=>{ S.meta.autoReveal = ar.value==='1'; saveMeta(); });
  const cs = root.querySelector('#console-select');
  if(cs) cs.addEventListener('change', ()=>{ consoleSelect(cs.value); });
}

if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("./sw.js").catch(function(e){ console.warn("SW register failed", e); }); }); }

render();
})();
</script>
